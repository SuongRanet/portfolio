<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Suong Ranet — Full Stack Web Developer. Software development student at Norton University building web applications with React, Tailwind CSS, PHP and MySQL."
    />
    <meta property="og:title" content="Suong Ranet — Full Stack Web Developer" />
    <meta
      property="og:description"
      content="Portfolio of Suong Ranet: projects, technical skills and contact details."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.webp" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0f131b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+Khmer:wdth,wght@62.5,100..900&display=swap"
    />
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      try {
        var t = JSON.parse(localStorage.getItem("theme") || "null");
        var theme = t && t.state && t.state.theme;
        if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>SuongRanet Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
